<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- A composix: flat stones stacked, largest at the base, a rounded capstone.
       currentColor throughout so GTK's symbolic pipeline recolours it to the
       theme foreground. -->
  <g fill="currentColor">
    <rect x="2.6" y="12.4" width="10.8" height="2.3" rx="1.15"/>
    <rect x="3.7" y="9.5"  width="8.6"  height="2.2" rx="1.1"/>
    <rect x="4.6" y="6.8"  width="6.8"  height="2.0" rx="1.0"/>
    <rect x="5.4" y="4.3"  width="5.2"  height="1.9" rx="0.95"/>
    <ellipse cx="8" cy="2.5" rx="1.8" ry="1.5"/>
  </g>
</svg>
